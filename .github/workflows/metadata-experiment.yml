name: metadata-experiment

# Test aid: PUTs maven-metadata.xml files that an earlier publish run prepared (from its artifact), then records what
# the registry serves afterwards: does a metadata PUT get stored, ignored or rejected? No Gradle, no checkout.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "The publish run whose prepared metadata to upload"
        required: true
      paths:
        description: "Space-separated maven-metadata.xml paths from that run's staging"
        required: true

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication
          path: ${{ runner.temp }}/handover
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: PUT and inspect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PATHS: ${{ inputs.paths }}
          REGISTRY: https://maven.pkg.github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/handover/files"
          auth="$RUNNER_TEMP/auth-header"
          (umask 077; printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" > "$auth")
          trap 'rm -f "$auth"' EXIT
          show() {
            local status
            status=$(curl -sS -L --retry 3 -o "$RUNNER_TEMP/body" -w '%{http_code}' -H @"$auth" "$REGISTRY/$1")
            echo "GET $1 -> $status ($(wc -c < "$RUNNER_TEMP/body") bytes, sha1 $(sha1sum "$RUNNER_TEMP/body" | cut -d' ' -f1))"
            head -c 3000 "$RUNNER_TEMP/body"; echo
          }
          for path in $PATHS; do
            [[ "$path" =~ ^[A-Za-z0-9._/-]+/maven-metadata\.xml$ && "$path" != *..* && -f "$path" ]] || { echo "::error::bad path: $path"; exit 1; }
            echo "##### $path"
            echo "-- before"; show "$path"; show "$path.sha1"; show "$path.sha512"
            echo "-- prepared (sha1 $(sha1sum "$path" | cut -d' ' -f1))"; cat "$path"
            status=$(curl -sS -o "$RUNNER_TEMP/put-body" -w '%{http_code}' -X PUT -H @"$auth" --data-binary @"$path" "$REGISTRY/$path")
            echo "PUT $path -> $status: $(head -c 500 "$RUNNER_TEMP/put-body")"
            echo "-- after"; show "$path"; show "$path.sha1"; show "$path.sha512"
          done
