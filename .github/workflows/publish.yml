name: publish

# Publishing split from building: `prepare` builds and stages with a read-only token, `publish` uploads exactly the
# staged files with the write token and runs no Gradle and no repository code, `verify` consumes the result from
# GitHub Packages. A disposable fixture: the version comes from the dispatch input.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0 or 0.3.0-SNAPSHOT)"
        required: true
      fail_after_artifacts:
        description: "Test only: stop publish's first attempt after 10 uploads, halfway through the files"
        type: boolean
        default: false
      expect_versions:
        description: "Test only: every version the coordinate metadata must list after this run, space-separated"
        required: true
      expect_release:
        description: "Test only: the metadata's expected <release> (empty: none)"
        default: ""
      expect_build:
        description: "Test only: a SNAPSHOT's expected build number"
        default: ""

permissions:
  contents: read

# Versions share the coordinate-level maven-metadata.xml: one publish at a time per repository.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: https://maven.pkg.github.com/${{ github.repository }}
  # The coordinates this repository publishes, as staging paths: library, plugin implementation, plugin marker.
  COORDINATES: >-
    io/github/leanish/test/publish-split-test
    io/github/leanish/test/publish-split-test-plugin
    io/github/leanish/test/publish-split-test/io.github.leanish.test.publish-split-test.gradle.plugin
  # The files each coordinate must publish, as suffixes after `<artifact>-<version>` (a marker is a POM only).
  # publish requires exactly these, each with its .md5/.sha1/.sha256/.sha512, and Maven metadata: nothing else.
  FILES_LIBRARY: .jar -sources.jar -javadoc.jar .pom .module
  FILES_MARKER: .pom

jobs:
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # To read the current remote metadata; Gradle never sees a write token.
      packages: read
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]] || { echo "::error::unexpected version: $VERSION"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # GitHub Packages generates all maven-metadata.xml itself from the files uploaded (a PUT of one is accepted and
      # ignored), so none is uploaded. A SNAPSHOT's version metadata is seeded so Gradle continues the remote build
      # number (Gradle merges a file repository's existing metadata), and its snapshot (timestamp-build) is recorded.
      - name: Seed a SNAPSHOT's version metadata
        if: endsWith(inputs.version, '-SNAPSHOT')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          staging=build/publication-staging
          auth="$RUNNER_TEMP/auth-header"
          (umask 077; printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" > "$auth")
          trap 'rm -f "$auth"' EXIT
          for coordinate in $COORDINATES; do
            path="$coordinate/$VERSION/maven-metadata.xml"
            status=$(curl -sS -L --retry 3 -o "$RUNNER_TEMP/seed" -w '%{http_code}' -H @"$auth" "$REGISTRY/$path")
            case "$status" in
              200) mkdir -p "$staging/$(dirname "$path")"; cp "$RUNNER_TEMP/seed" "$staging/$path"; echo "seeded $path"; cat "$staging/$path"
                   printf '%s %s\n' "$(python3 -I -c 'import sys, xml.etree.ElementTree as ET
          s = ET.parse(sys.argv[1]).getroot().find("versioning/snapshot")
          print("%s-%s" % (s.findtext("timestamp").strip(), s.findtext("buildNumber").strip()))' "$staging/$path")" "$path" >> "$RUNNER_TEMP/seeded.txt" ;;
              404) echo "absent $path"; printf 'absent %s\n' "$path" >> "$RUNNER_TEMP/seeded.txt" ;;
              *) echo "::error::GET $path returned $status"; exit 1 ;;
            esac
          done

      - name: Build, check and stage
        env:
          VERSION: ${{ inputs.version }}
        run: ./gradlew check publishAllPublicationsToStagingRepository -PpublishVersion="$VERSION"

      - name: Write the manifest and summary
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          staging=build/publication-staging
          [ -z "$(find "$staging" -type l)" ] || { echo "::error::staging contains symlinks"; exit 1; }
          # The registry generates coordinate metadata itself: Gradle's local copy isn't handed over.
          for coordinate in $COORDINATES; do rm -f "$staging/$coordinate"/maven-metadata.xml*; done
          mkdir -p "$RUNNER_TEMP/handover"
          cp -R "$staging" "$RUNNER_TEMP/handover/files"
          touch "$RUNNER_TEMP/seeded.txt"
          cp "$RUNNER_TEMP/seeded.txt" "$RUNNER_TEMP/handover/seeded.txt"
          (cd "$RUNNER_TEMP/handover/files" && find . -type f -printf '%P\n' | LC_ALL=C sort | xargs -r -d '\n' sha256sum) > "$RUNNER_TEMP/handover/manifest.txt"
          {
            echo "### Prepared $VERSION from $SHA"
            echo
            echo '```'
            cat "$RUNNER_TEMP/handover/manifest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication
          path: ${{ runner.temp }}/handover
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-26.04
    # Only the upload: no checkout, no Gradle, no cache; the files come from prepare's artifact.
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication
          path: ${{ runner.temp }}/handover

      - name: Verify the hand-over
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/handover/files"
          [ -z "$(find . -type l)" ] || { echo "::error::the hand-over contains symlinks"; exit 1; }
          grep -qvE '^[0-9a-f]{64}  [^ /][^ ]*$' ../manifest.txt && { echo "::error::malformed manifest line"; exit 1; }
          sha256sum --quiet --strict -c ../manifest.txt
          # Every file is in the manifest, exactly once.
          diff <(find . -type f -printf '%P\n' | LC_ALL=C sort) <(cut -d' ' -f3- ../manifest.txt) > /dev/null \
            || { echo "::error::files and manifest differ"; exit 1; }
          [ "$(cut -d' ' -f3- ../manifest.txt | sort | uniq -d)" = "" ] || { echo "::error::duplicate paths"; exit 1; }
          # The exact set this version must publish, built from the coordinates (not from what was handed over): a
          # missing publication or an extra path fails. A SNAPSHOT's file version comes from its version metadata.
          # Reads a Maven metadata field with an XML parser (the registry serves the XML on one line).
          meta() {
            python3 -I -c 'import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          paths = {"versions": "versioning/versions/version", "release": "versioning/release",
                   "timestamp": "versioning/snapshot/timestamp", "buildNumber": "versioning/snapshot/buildNumber",
                   "values": "versioning/snapshotVersions/snapshotVersion/value"}
          if sys.argv[2] == "newest":
              # The newest value per (extension, classifier): the registry keeps every build listed.
              newest = {}
              for v in root.findall("versioning/snapshotVersions/snapshotVersion"):
                  key = (v.findtext("extension", "").strip(), v.findtext("classifier", "").strip())
                  newest[key] = max(newest.get(key, ""), v.findtext("value", "").strip())
              for key in sorted(newest):
                  print(newest[key])
          else:
              for element in root.findall(paths[sys.argv[2]]):
                  print((element.text or "").strip())' "$1" "$2"
          }
          expected="$RUNNER_TEMP/expected.txt"
          : > "$expected"
          with_sidecars() { for suffix in "" .md5 .sha1 .sha256 .sha512; do printf '%s%s\n' "$1" "$suffix" >> "$expected"; done; }
          for coordinate in $COORDINATES; do
            artifact="${coordinate##*/}"
            files="$FILES_LIBRARY"
            [[ "$artifact" == *.gradle.plugin ]] && files="$FILES_MARKER"
            file_version="$VERSION"
            if [[ "$VERSION" == *-SNAPSHOT ]]; then
              metadata="$coordinate/$VERSION/maven-metadata.xml"
              [ -f "$metadata" ] || { echo "::error::missing $metadata"; exit 1; }
              timestamp=$(meta "$metadata" timestamp)
              build=$(meta "$metadata" buildNumber)
              [[ "$timestamp" =~ ^[0-9]{8}\.[0-9]{6}$ && "$build" =~ ^[0-9]+$ ]] || { echo "::error::no snapshot timestamp in $metadata"; exit 1; }
              file_version="${VERSION%-SNAPSHOT}-$timestamp-$build"
              with_sidecars "$metadata"
            fi
            for suffix in $files; do with_sidecars "$coordinate/$VERSION/$artifact-$file_version$suffix"; done
          done
          diff <(LC_ALL=C sort "$expected") <(cut -d' ' -f3- ../manifest.txt | LC_ALL=C sort) \
            || { echo "::error::the hand-over isn't exactly the expected files (diff above: < missing, > unexpected)"; exit 1; }
          grep -qvE '^(absent|[0-9]{8}\.[0-9]{6}-[0-9]+) [^ /][^ ]*$' ../seeded.txt && { echo "::error::malformed seeded line"; exit 1; }
          diff <(grep -E '/maven-metadata\.xml$' "$expected" | LC_ALL=C sort) <(cut -d' ' -f2- ../seeded.txt | LC_ALL=C sort) \
            || { echo "::error::seeded.txt doesn't cover exactly the SNAPSHOT version metadata"; exit 1; }
          echo "hand-over verified: $(wc -l < ../manifest.txt) files"

      - name: Upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAIL_AFTER_ARTIFACTS: ${{ inputs.fail_after_artifacts }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/handover/files"
          auth="$RUNNER_TEMP/auth-header"
          (umask 077; printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" > "$auth")
          trap 'rm -f "$auth"' EXIT
          remote="$RUNNER_TEMP/remote"
          # GET follows redirects (downloads may be served from storage; curl drops the header on another host).
          # PUTs aren't retried (a re-run of this job with the same artifact recovers).
          get() { curl -sS -L --retry 3 -o "$remote" -w '%{http_code}' -H @"$auth" "$REGISTRY/$1"; }
          put() {
            local status
            status=$(curl -sS -o "$RUNNER_TEMP/put-body" -w '%{http_code}' -X PUT -H @"$auth" --data-binary @"$1" "$REGISTRY/$1")
            echo "PUT $1 -> $status"
            [[ "$status" == 2?? ]] || { echo "::error::PUT $1 returned $status: $(head -c 500 "$RUNNER_TEMP/put-body")"; exit 1; }
            status=$(get "$1")
            [ "$status" = 200 ] && cmp -s "$remote" "$1" || { echo "::error::after PUT, GET $1 returned $status or other bytes"; exit 1; }
          }
          is_metadata() { [[ "$1" =~ /maven-metadata\.xml(\.(md5|sha1|sha256|sha512))?$ ]]; }

          identity() { python3 -I -c 'import sys, xml.etree.ElementTree as ET
          s = ET.parse(sys.argv[1]).getroot().find("versioning/snapshot")
          print("%s-%s" % (s.findtext("timestamp").strip(), s.findtext("buildNumber").strip()))' "$1"; }
          # Before writing anything: a SNAPSHOT's latest build on the registry must still be the one prepare seeded (a
          # fresh publish) or this one (a retry), so an older build can't become the latest over a newer one. The
          # registry rebuilds the XML from the files, so builds are compared, not bytes.
          while read -r seeded path; do
            status=$(get "$path")
            case "$status" in
              200) now=$(identity "$remote") ;;
              404) now=absent ;;
              *) echo "::error::GET $path returned $status"; exit 1 ;;
            esac
            [ "$now" = "$seeded" ] || [ "$now" = "$(identity "$path")" ] \
              || { echo "::error::$path is at build $now, seeded $seeded: a newer build exists, prepare again"; exit 1; }
          done < ../seeded.txt

          mapfile -t files < <(cut -d' ' -f3- ../manifest.txt)
          uploaded=0
          # Artifacts and their checksums are immutable: identical → skip, different → fail, absent → upload. Once
          # some of a version's files are up, only a re-run of this job with the same artifact completes it: a rebuild
          # with other bytes is refused here.
          for path in "${files[@]}"; do
            is_metadata "$path" && continue
            status=$(get "$path")
            case "$status" in
              200) cmp -s "$remote" "$path" && { echo "same $path"; continue; }
                   echo "::error::$path already exists with other bytes"; exit 1 ;;
              404) put "$path"; uploaded=$((uploaded + 1)) ;;
              *) echo "::error::GET $path returned $status"; exit 1 ;;
            esac
            # Test hook only (the real repositories don't get it): the first attempt stops halfway, so re-running the
            # failed job tests the recovery.
            if [ "$FAIL_AFTER_ARTIFACTS" = true ] && [ "$RUN_ATTEMPT" = 1 ] && [ "$uploaded" -ge 10 ]; then
              echo "::error::stopping after $uploaded uploads (test input)"; exit 1
            fi
          done

          echo "done; the registry generates the Maven metadata from these files"

  verify:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      # The remote metadata must list exactly the expected versions (none lost), the expected release, and for a
      # SNAPSHOT the expected build number, with every snapshotVersion pointing at that build.
      - name: Check the remote metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECT_VERSIONS: ${{ inputs.expect_versions }}
          EXPECT_RELEASE: ${{ inputs.expect_release }}
          EXPECT_BUILD: ${{ inputs.expect_build }}
        run: |
          set -euo pipefail
          auth="$RUNNER_TEMP/auth-header"
          (umask 077; printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" > "$auth")
          trap 'rm -f "$auth"' EXIT
          # Reads a Maven metadata field with an XML parser (the registry serves the XML on one line).
          meta() {
            python3 -I -c 'import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          paths = {"versions": "versioning/versions/version", "release": "versioning/release",
                   "timestamp": "versioning/snapshot/timestamp", "buildNumber": "versioning/snapshot/buildNumber",
                   "values": "versioning/snapshotVersions/snapshotVersion/value"}
          if sys.argv[2] == "newest":
              # The newest value per (extension, classifier): the registry keeps every build listed.
              newest = {}
              for v in root.findall("versioning/snapshotVersions/snapshotVersion"):
                  key = (v.findtext("extension", "").strip(), v.findtext("classifier", "").strip())
                  newest[key] = max(newest.get(key, ""), v.findtext("value", "").strip())
              for key in sorted(newest):
                  print(newest[key])
          else:
              for element in root.findall(paths[sys.argv[2]]):
                  print((element.text or "").strip())' "$1" "$2"
          }
          metadata="$RUNNER_TEMP/metadata.xml"
          for coordinate in $COORDINATES; do
            echo "== $coordinate"
            curl -sS -L -f --retry 3 -H @"$auth" -o "$metadata" "$REGISTRY/$coordinate/maven-metadata.xml"
            cat "$metadata"
            listed=$(meta "$metadata" versions | LC_ALL=C sort | tr '\n' ' ')
            wanted=$(printf '%s\n' $EXPECT_VERSIONS | LC_ALL=C sort | tr '\n' ' ')
            [ "$listed" = "$wanted" ] || { echo "::error::$coordinate lists [$listed], expected [$wanted]"; exit 1; }
            release=$(meta "$metadata" release)
            [ "$release" = "$EXPECT_RELEASE" ] || { echo "::error::$coordinate release is '$release', expected '$EXPECT_RELEASE'"; exit 1; }
            if [[ "$VERSION" == *-SNAPSHOT ]]; then
              curl -sS -L -f --retry 3 -H @"$auth" -o "$metadata" "$REGISTRY/$coordinate/$VERSION/maven-metadata.xml"
              cat "$metadata"
              build=$(meta "$metadata" buildNumber)
              timestamp=$(meta "$metadata" timestamp)
              [ "$build" = "$EXPECT_BUILD" ] || { echo "::error::$coordinate build $build, expected $EXPECT_BUILD"; exit 1; }
              value="${VERSION%-SNAPSHOT}-$timestamp-$build"
              # Earlier builds stay listed (and their files stay); the newest entry of each file must be this build.
              meta "$metadata" newest > "$RUNNER_TEMP/values"
              [ -s "$RUNNER_TEMP/values" ] && ! grep -qvxF "$value" "$RUNNER_TEMP/values" \
                || { echo "::error::$coordinate: the newest snapshotVersions aren't all $value"; cat "$RUNNER_TEMP/values"; exit 1; }
              unique=":$timestamp-$build"
            else
              unique=
            fi
            # The library (the first coordinate) is what the consumer must resolve, at exactly this build.
            if [ "$coordinate" = "${COORDINATES%% *}" ]; then
              echo "io.github.leanish.test:${coordinate##*/}:$VERSION$unique" > "$RUNNER_TEMP/expected-id"
            fi
          done

      # Each metadata source from scratch: its own Gradle home, no cache, a clean consumer.
      - name: Consume the published version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          expected_id=$(cat "$RUNNER_TEMP/expected-id")
          for source in gradle pom; do
            echo "== metadata source: $source"
            rm -rf consumer/build consumer/.gradle
            GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home-$source" ./gradlew -p consumer --no-configuration-cache \
              greet resolvedFiles publishSplitHello -PtestVersion="$VERSION" -PmetadataSource="$source" | tee "$RUNNER_TEMP/consumer.log"
            grep -qE "^resolved: ${expected_id//./\\.} " "$RUNNER_TEMP/consumer.log" || { echo "::error::didn't resolve $expected_id"; exit 1; }
            grep -qxF "Hello, consumer" "$RUNNER_TEMP/consumer.log" || { echo "::error::the library didn't run"; exit 1; }
            grep -qxF "publish-split-test plugin applied" "$RUNNER_TEMP/consumer.log" || { echo "::error::the plugin didn't run"; exit 1; }
          done
