name: publish

# Calls java-conventions' reusable publishing workflow (pinned to the commit under test) for the fixture's library,
# plugin implementation and plugin marker.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: leanish/java-conventions/.github/workflows/publishing-github-packages.yml@2d7996f8777be6812bdb973c424cba2c02843adb # publish-split-reusable-wip
    with:
      coordinates: >-
        io/github/leanish/test/publish-split-test
        io/github/leanish/test/publish-split-test-plugin
        io/github/leanish/test/publish-split-test/io.github.leanish.test.publish-split-test.gradle.plugin
