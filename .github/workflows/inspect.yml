name: inspect

# Test aid: prints files from this repository's GitHub Packages Maven registry (status and body), to see what the
# registry serves for paths nobody uploaded (metadata, checksums).

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Space-separated registry paths"
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    steps:
      - name: Print
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PATHS: ${{ inputs.paths }}
          REGISTRY: https://maven.pkg.github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          auth="$RUNNER_TEMP/auth-header"
          (umask 077; printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" > "$auth")
          trap 'rm -f "$auth"' EXIT
          for path in $PATHS; do
            [[ "$path" =~ ^[A-Za-z0-9._/-]+$ && "$path" != *..* ]] || { echo "::error::bad path: $path"; exit 1; }
            status=$(curl -sS -L --retry 3 -o "$RUNNER_TEMP/body" -w '%{http_code}' -H @"$auth" "$REGISTRY/$path")
            echo "== $path -> $status ($(wc -c < "$RUNNER_TEMP/body") bytes, sha256 $(sha256sum "$RUNNER_TEMP/body" | cut -d' ' -f1))"
            head -c 4000 "$RUNNER_TEMP/body"; echo
          done
